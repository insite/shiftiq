<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title><!-- TITLE --></title>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            font-family: Arial;
            font-size: 10pt;
        }

        .report-item + .report-item {
            margin-top: 40px;
        }

        .report-item h2 {
            font-size: 14pt;
            margin: 0 0 2px 0;
        }

        .report-item .text-muted {
            color: #666666;
            margin-bottom: 12px;
        }

        .report-item .chart-container img {
            width: 100%;
        }

        .report-item table {
            width: 100%;
            border-collapse: collapse;
            font-size: 8pt;
        }

        .report-item table th {
            border-bottom: 1px solid #37384e;
            padding: 4px 6px;
            text-align: center;
            white-space: nowrap;
        }

        .report-item table th:first-child {
            text-align: left;
        }

        .report-item table td {
            border-bottom: 1px solid #e4e4e4;
            padding: 4px 6px;
        }

        .report-item table td.data-column {
            text-align: center;
            white-space: nowrap;
        }

        .report-item table tr.odd td {
            background-color: #f7f7f7;
        }
    </style>
</head>
<body>
    <!-- BODY -->
</body>
</html>
